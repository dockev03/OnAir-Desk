name: CI

on:
  push:
    branches-ignore: [main, master, staging]
  pull_request:
  # Rejouée en entier avant chaque publication d'image (release.yml).
  workflow_call:

permissions:
  contents: read

# Runners fixés en 24.04 : Playwright 1.56 ne gère pas Ubuntu 26.04 (ubuntu-latest).
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm de la version du projet
        run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image (sans publication)
        run: docker build -t onair-desk:ci .

  # Requêtes du connecteur RadioDJ contre un vrai MariaDB (version relevée chez la station).
  mariadb:
    runs-on: ubuntu-24.04
    needs: check
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: racine-ci
          MARIADB_DATABASE: radiodj_test
          MARIADB_USER: onairdesk
          MARIADB_PASSWORD: mot-de-passe-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm de la version du projet
        run: npm install -g npm@11.21.1
      - run: npm ci
      - name: Tests SQL RadioDJ
        env:
          MARIADB_TEST_URL: mysql://onairdesk:mot-de-passe-ci@127.0.0.1:3306/radiodj_test
        run: npx vitest run apps/server/test/radiodj-mariadb.test.ts

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm de la version du projet
        run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run build
      - name: Chromium pour Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
