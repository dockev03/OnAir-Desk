name: Release

# Publication de l'image Docker sur GHCR, déclenchée par un tag de version poussé sur main.
# Tag attendu : vX.Y.Z (SemVer), identique à la version des package.json (voir CLAUDE.md).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Même contrôle qu'une branche : lint, typecheck, tests, build, image, MariaDB, e2e.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag sur main et version cohérente
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME ne pointe pas sur un commit de main."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mais package.json est en $version."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<propriétaire>/<dépôt> en minuscules ; tags X.Y.Z, X.Y et latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=OnAir-Desk
            org.opencontainers.image.description=Écran studio web pour radios

      - name: Construction et publication (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Une seule image amd64 dans le registre (sans manifeste d'attestation « unknown/unknown »).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
