# Stack Portainer (mode « Repository ») : Portainer lit ce fichier dans le dépôt et lance l'image
# publiée sur GHCR par la CI (workflow Release, à chaque tag vX.Y.Z).
# Les variables se renseignent dans Portainer (section « Environment variables ») : voir .env.example.
# Construire l'image depuis les sources à la place : ajouter docker-compose.build.yml (voir README).
name: onair-desk

services:
  onair-desk:
    # Version à déployer (ex. 0.11.0) : la fixer plutôt que « latest » permet de revenir en arrière.
    image: ghcr.io/dockev03/onair-desk:${ONAIR_DESK_VERSION:-latest}
    container_name: onair-desk
    restart: unless-stopped
    init: true
    ports:
      - '${HOST_PORT:-443}:8443'
      # Port HTTP dédié aux connecteurs (plugin RadioDJ). Fermé par défaut : l'application ne
      # l'écoute que si CONNECTOR_HTTP_PORT est renseigné, et Docker ne le publie que sur
      # l'interface locale tant que CONNECTOR_BIND n'est pas l'adresse de la Debian sur le réseau.
      - '${CONNECTOR_BIND:-127.0.0.1}:${CONNECTOR_HTTP_PORT:-8780}:${CONNECTOR_HTTP_PORT:-8780}'
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN est obligatoire, ex. https://onair-desk.lan}
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}
      TZ: ${TZ:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONNECTOR_HTTP_PORT: ${CONNECTOR_HTTP_PORT:-}
      # Secret : mot de passe du compte MariaDB (lecture seule) de RadioDJ.
      RADIODJ_DB_PASSWORD: ${RADIODJ_DB_PASSWORD:-}
      # Secret : clé API d'un compte AzuraCast dédié, sans droit d'administration (facultatif).
      AZURACAST_API_KEY: ${AZURACAST_API_KEY:-}
      # Certificat auto-signé d'AzuraCast (facultatif) : décommenter aussi le volume plus bas.
      AZURACAST_CA_FILE: ${AZURACAST_CA_FILE:-}
      # Certificat fourni par la station (facultatif) : décommenter aussi le volume plus bas.
      # TLS_CERT_FILE: /certs/onair-desk.crt
      # TLS_KEY_FILE: /certs/onair-desk.key
    volumes:
      - onair-desk-data:/data
      # - /etc/onair-desk/certs:/certs:ro
    # Durcissement : système de fichiers en lecture seule (sauf /data et /tmp), aucun privilège.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  onair-desk-data:
